<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101619">
  <meta name="description" content="A tiny, tactile ballistics arcade. Line up, account for the drop, and make every shot count.">
  <title>Deadeye — Pocket Ballistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" id="gameShell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Deadeye home"><span class="brand-mark">D<span>·</span></span><span class="brand-name">DEADEYE</span></a>
      <div class="mission-heading"><span class="eyebrow">FIELD NOTES / <span id="levelNumber">01</span></span><h1 id="levelName">The Quiet Range</h1></div>
      <div class="top-meta"><span class="wind"><i class="wind-icon">↗</i><span id="windText">WIND 02</span></span><span class="ammo"><i class="ammo-dot"></i><span id="ammoText">03 ROUNDS</span></span><button class="icon-button" id="soundButton" aria-label="Toggle sound" title="Toggle sound">♫</button></div>
    </header>
    <section class="game-stage" id="gameStage" aria-label="Shooting range">
      <canvas id="scene" width="960" height="540" aria-label="Pixel art shooting range"></canvas>
      <div class="scene-vignette"></div>
      <div class="stage-label"><span class="live-dot"></span><span id="stageCaption">RANGE 01 — DUST & TIN</span></div>
      <div class="wind-indicator"><span>WIND</span><span class="wind-arrow" id="windArrow">→</span><span id="windSpeed">2.0</span></div>
      <div class="aim-readout"><span class="readout-label">ELEVATION</span><b id="angleReadout">12.0°</b></div>
      <div class="impact-legend"><i></i> PREDICTED IMPACT</div>
      <div class="control-hint" id="controlHint"><span class="hint-key">DRAG</span> to line up <span class="hint-sep">·</span> <span class="hint-key">HOLD</span> to steady</div>
      <div class="aim-control" id="aimControl" aria-label="Aim and position control" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="Drag to move and aim">
        <span class="aim-label">MOVE + AIM</span><span class="pad-cross horizontal"></span><span class="pad-cross vertical"></span><span class="pad-ring ring-one"></span><span class="pad-ring ring-two"></span><span class="pad-center" id="padKnob"><span></span></span><span class="pad-arrow">↔</span><span class="pad-arrow up">↕</span>
      </div>
      <button class="fire-button" id="fireButton" aria-label="Fire" type="button"><span class="fire-sight">⊕</span><span class="fire-copy"><b>FIRE</b><small>tap to shoot</small></span><span class="fire-key">SPACE</span></button>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="modal-backdrop" id="modalBackdrop">
        <section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-kicker"><span class="live-dot"></span> FIELD MANUAL / 001</div>
          <div class="modal-content" id="modalContent"></div>
        </section>
      </div>
      <div class="rotate-hint"><span>↻</span><b>Turn your phone sideways</b><small>Deadeye plays best in landscape</small></div>
    </section>
    <footer class="bottombar">
      <div class="progress-block"><div class="progress-head"><span>RANGE PROGRESS</span><b id="progressText">01 <i>/</i> 04</b></div><div class="progress-track" id="progressTrack" aria-label="Level progress"></div></div>
      <div class="score-block"><span class="score-label">BEST SHOT</span><span class="score-value" id="scoreValue">—<small> px</small></span></div>
      <button class="menu-button" id="levelsButton" type="button"><span class="menu-icon">▦</span> RANGES <span class="menu-count">04</span></button>
      <button class="help-button" id="helpButton" type="button" aria-label="How to play">?</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
